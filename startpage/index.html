<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>startpage</title>
        <link
            href="/startpage/style.css"
            rel="stylesheet"
            type="text/css"
            media="all"
        />
        <link
            href="/media/images/favicons/wing.gif"
            rel="icon"
            type="image/gif"
        />
    </head>
    <body>
        <section class="top-window">
            <div class="command-line">
                <span class="hostname"></span>
                <span class="directory">~</span>
                <span class="prompt">></span>
                <span id="top-last-command" class="command"></span>
            </div>
            <div class="command-line">&nbsp;</div>
            <div class="top-output"></div>
            <div class="command-line">&nbsp;</div>
            <div class="command-line" style="display: flex">
                <span class="hostname"></span>
                <span class="directory"> ~ </span>
                <span class="prompt">> </span>
                <input type="text" id="top-input" />
            </div>
        </section>
        <script src="https://unpkg.com/bowser@2.4.0/es5.js"></script>
        <script type="module" src="/startpage/startpage.js"></script>
    </body>
</html>
