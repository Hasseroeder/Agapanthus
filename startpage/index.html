<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>startpage</title>
        <link
            href="/startpage/style.css"
            rel="stylesheet"
            type="text/css"
            media="all"
        />
        <link
            href="/media/images/favicons/wing.gif"
            rel="icon"
            type="image/gif"
        />
    </head>
    <body>
        <section class="fastfetch-window">
            <div id="last-command" class="command-line">
                <span class="hostname"></span>
                <span class="directory">~</span>
                <span class="prompt">></span>
                <span class="command">fetch</span>
            </div>
            <div class="fastfetch-wrapper">
                <div class="fetch-text-wrapper"></div>
            </div>
            <div id="command-input" class="command-line">
                <span class="hostname"></span>
                <span class="directory">~</span>
                <span class="prompt">></span>
            </div>
        </section>
        <script src="https://unpkg.com/bowser@2.4.0/es5.js"></script>
        <script type="module" src="/startpage/startpage.js"></script>
    </body>
</html>
